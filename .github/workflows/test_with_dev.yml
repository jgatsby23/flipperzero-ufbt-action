name: Action tests

on:
  push:
    branches:
      - dev
      - "release*"
    tags:
      - '*'
  pull_request:

jobs:
  run-test-on-latest:
    name: Using dev sdk
    uses: ./.github/workflows/test_ufbt.yml
    with:
      ufbt-version: prerelease
      sdk-channel: dev

- name: Build Flipper Application Package (.fap)
  uses: flipperdevices/flipperzero-ufbt-action@v0.1.3
